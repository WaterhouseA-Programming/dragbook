<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in · DragBook</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&family=Abril+Fatface&display=swap" rel="stylesheet">
<style>
  :root {
    --hot-pink: #FF2D78;
    --electric-purple: #9B00FF;
    --acid-yellow: #FFE600;
    --cyan: #00F5FF;
    --deep-black: #0A0008;
    --soft-black: #130012;
    --card-bg: #1A0020;
    --text-light: #FFE8FF;
    --text-muted: #C084C8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--deep-black);
    background-image:
      radial-gradient(circle at 20% 20%, rgba(255,45,120,0.15), transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(155,0,255,0.15), transparent 50%);
    color: var(--text-light);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  nav {
    padding: 20px 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .logo {
    font-family: 'Abril Fatface', cursive;
    font-size: 2rem;
    background: linear-gradient(135deg, var(--hot-pink), var(--electric-purple), var(--cyan));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-decoration: none;
  }
  .nav-right a {
    color: var(--text-muted);
    text-decoration: none;
    font-size: 0.95rem;
  }
  .nav-right a:hover { color: var(--text-light); }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card-bg);
    border: 1px solid rgba(255,45,120,0.25);
    border-radius: 24px;
    padding: 40px;
    box-shadow: 0 20px 60px rgba(155,0,255,0.15);
  }
  h1 {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    margin-bottom: 8px;
    background: linear-gradient(135deg, var(--hot-pink), var(--cyan));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  p.sub { color: var(--text-muted); margin-bottom: 24px; font-size: 0.95rem; }

  label {
    display: block;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    margin: 14px 0 6px;
  }
  input {
    width: 100%;
    padding: 12px 14px;
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,232,255,0.1);
    border-radius: 10px;
    color: var(--text-light);
    font: inherit;
    font-size: 1rem;
  }
  input:focus {
    outline: none;
    border-color: var(--hot-pink);
    box-shadow: 0 0 0 3px rgba(255,45,120,0.2);
  }
  .submit {
    width: 100%;
    margin-top: 22px;
    padding: 14px;
    border: 0;
    border-radius: 100px;
    background: linear-gradient(135deg, var(--hot-pink), var(--electric-purple));
    color: white;
    font: inherit;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 0 20px rgba(255,45,120,0.4);
  }
  .submit:hover { transform: translateY(-1px); box-shadow: 0 0 30px rgba(255,45,120,0.6); }
  .submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
  .switcher { margin-top: 18px; text-align: center; color: var(--text-muted); font-size: 0.9rem; }
  .switcher a { color: var(--cyan); text-decoration: none; }
  .switcher a:hover { text-decoration: underline; }

  .message {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 0.9rem;
    display: none;
  }
  .message.error { background: rgba(255,45,120,0.15); border: 1px solid rgba(255,45,120,0.4); display: block; }
  .message.ok { background: rgba(0,245,255,0.1); border: 1px solid rgba(0,245,255,0.4); display: block; color: var(--cyan); }

  @media (max-width: 600px) {
    nav { padding: 16px 20px; }
    .card { padding: 28px 22px; border-radius: 18px; }
    h1 { font-size: 1.6rem; }
  }
</style>
</head>
<body>

<nav>
  <a href="dragbook.html" class="logo">DragBook</a>
  <div class="nav-right">
    <a href="dragbook-signup.html">New here? Sign up</a>
  </div>
</nav>

<main>
  <div class="card">
    <h1>Welcome back</h1>
    <p class="sub">Log in to your DragBook account.</p>

    <form id="login-form">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required autocomplete="email" placeholder="you@example.com">

      <label for="password">Password</label>
      <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="Your password">

      <button type="submit" class="submit" id="submit-btn">Log in</button>
    </form>

    <div id="message" class="message"></div>

    <div class="switcher">
      Don't have an account? <a href="dragbook-signup.html">Sign up</a>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script>
  const form = document.getElementById('login-form');
  const msg = document.getElementById('message');
  const submitBtn = document.getElementById('submit-btn');

  // Arriving from the sign-up confirmation link leaves a session in place.
  (async () => {
    const { data: { session } } = await window.sb.auth.getSession();
    if (!session) return;
    const profile = await window.dragbook.ensureProfile();
    window.location.href = profile && profile.account_type === 'performer'
      ? 'dragbook-profile-edit.html'
      : 'dragbook-browse.html';
  })();

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.className = 'message';
    msg.textContent = '';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Logging in...';

    try {
      await window.dragbook.signIn({
        email: form.email.value.trim(),
        password: form.password.value
      });
      const profile = await window.dragbook.getProfile();
      window.location.href = profile && profile.account_type === 'performer'
        ? 'dragbook-profile-edit.html'
        : 'dragbook-browse.html';
    } catch (err) {
      msg.className = 'message error';
      msg.textContent = err.message || 'Could not log in.';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Log in';
    }
  });
</script>
</body>
</html>
