<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DragBook — UI Kit</title>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Staatliches&family=Barlow+Condensed:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --hot-pink:#FF2D78;--electric-purple:#9B00FF;--acid-yellow:#FFE600;--cyan:#00F5FF;
    --deep-black:#0A0008;--card-bg:#1A0020;--card-bg-2:#150018;
    --text-light:#FFE8FF;--text-muted:#C084C8;
    --border:rgba(255,255,255,0.06);--border-pink:rgba(255,45,120,0.3);
    --grad-primary:linear-gradient(135deg,#FF2D78,#9B00FF);
    --font-display:'Abril Fatface',cursive;
    --font-heading:'Staatliches',cursive;
    --font-subhead:'Barlow Condensed',sans-serif;
    --font-body:'DM Sans',sans-serif;
  }
  html{scroll-behavior:smooth}
  body{background:var(--deep-black);color:var(--text-light);font-family:var(--font-body);overflow-x:hidden;cursor:none}
  .cursor{width:20px;height:20px;border:2px solid var(--hot-pink);border-radius:50%;position:fixed;pointer-events:none;z-index:9999;transition:transform .15s,background .15s;mix-blend-mode:screen}
  .cursor-dot{width:6px;height:6px;background:var(--acid-yellow);border-radius:50%;position:fixed;pointer-events:none;z-index:9999}
  .glitter-canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:.3}
  a,button{cursor:none}
  .grad-text{background:var(--grad-primary);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
  .grad-text-triple{background:linear-gradient(135deg,#FF2D78,#9B00FF,#00F5FF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
  .btn-primary{background:var(--grad-primary);border:none;color:#fff;padding:14px 36px;border-radius:100px;font-family:var(--font-body);font-size:.92rem;font-weight:500;cursor:none;transition:transform .2s,box-shadow .2s;display:inline-block;text-decoration:none;letter-spacing:.02em}
  .btn-primary:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 20px 50px rgba(255,45,120,.5)}
  .btn-secondary{background:transparent;border:1px solid rgba(255,255,255,.2);color:var(--text-light);padding:14px 36px;border-radius:100px;font-family:var(--font-body);font-size:.92rem;font-weight:400;cursor:none;transition:all .2s;display:inline-block;text-decoration:none}
  .btn-secondary:hover{border-color:var(--hot-pink);color:var(--hot-pink);transform:translateY(-2px)}
  .eyebrow{font-size:.68rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--hot-pink);display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .eyebrow::before{content:'';width:28px;height:2px;background:var(--hot-pink);flex-shrink:0}
  #root{position:relative;z-index:1}
</style>
</head>
<body>
<canvas class="glitter-canvas" id="glitterCanvas"></canvas>
<div class="cursor" id="cursor"></div>
<div class="cursor-dot" id="cursorDot"></div>
<div id="root"></div>

<script type="text/babel" src="Shared.jsx"></script>
<script type="text/babel" src="HomePage.jsx"></script>
<script type="text/babel" src="BrowsePage.jsx"></script>
<script type="text/babel" src="ProfilePage.jsx"></script>
<script type="text/babel" src="PricingPage.jsx"></script>
<script type="text/babel" src="HowItWorksPage.jsx"></script>
<script type="text/babel" src="App.jsx"></script>

<script>
const cursor = document.getElementById('cursor');
const dot = document.getElementById('cursorDot');
document.addEventListener('mousemove', e => {
  cursor.style.left = e.clientX-10+'px'; cursor.style.top = e.clientY-10+'px';
  dot.style.left = e.clientX-3+'px'; dot.style.top = e.clientY-3+'px';
});
document.addEventListener('mouseover', e => {
  if(e.target.closest('a,button,[data-hover]')) {
    cursor.style.transform='scale(2)'; cursor.style.background='rgba(255,45,120,.15)';
  } else {
    cursor.style.transform='scale(1)'; cursor.style.background='transparent';
  }
});

const canvas = document.getElementById('glitterCanvas');
const ctx = canvas.getContext('2d');
function resizeCanvas(){ canvas.width=window.innerWidth; canvas.height=window.innerHeight; }
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
const cols = ['#FF2D78','#FF2D78','#9B00FF','#FFE600','#00F5FF','#FF69B4','#FF2D78'];

// Big bright particles
const pts = Array.from({length:160},()=>({
  x:Math.random()*2000, y:Math.random()*1200,
  s:Math.random()*6+2,
  c:cols[~~(Math.random()*cols.length)],
  vy:Math.random()*1.5+0.5,
  vx:(Math.random()-.5)*1.2,
  t:Math.random()*Math.PI*2,
  speed:Math.random()*0.08+0.04,
  star: Math.random()>0.5
}));

// Shooting stars
const shoots = [];
function spawnShoot(){
  shoots.push({
    x:Math.random()*canvas.width,y:Math.random()*canvas.height*0.5,
    vx:Math.random()*8+6, vy:Math.random()*4+2,
    len:Math.random()*120+60,
    c:cols[~~(Math.random()*cols.length)],
    alpha:1, life:0
  });
}
setInterval(spawnShoot,800);

function drawStar(ctx,x,y,r){
  ctx.beginPath();
  for(let i=0;i<5;i++){
    const a=Math.PI*2*i/5-Math.PI/2;
    const a2=a+Math.PI/5;
    ctx.lineTo(x+Math.cos(a)*r, y+Math.sin(a)*r);
    ctx.lineTo(x+Math.cos(a2)*r*0.4, y+Math.sin(a2)*r*0.4);
  }
  ctx.closePath();
  ctx.fill();
}

function drawGlitter(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  
  // Draw shooting stars
  for(let i=shoots.length-1;i>=0;i--){
    const s=shoots[i];
    s.life+=0.04; s.alpha=Math.max(0,1-s.life);
    if(s.alpha<=0){shoots.splice(i,1);continue;}
    ctx.save();
    ctx.globalAlpha=s.alpha*0.9;
    const grad=ctx.createLinearGradient(s.x,s.y,s.x-s.len*(s.vx/10),s.y-s.len*(s.vy/10));
    grad.addColorStop(0,s.c); grad.addColorStop(1,'transparent');
    ctx.strokeStyle=grad; ctx.lineWidth=2.5;
    ctx.shadowBlur=12; ctx.shadowColor=s.c;
    ctx.beginPath(); ctx.moveTo(s.x,s.y);
    ctx.lineTo(s.x-s.len*(s.vx/10),s.y-s.len*(s.vy/10));
    ctx.stroke(); ctx.restore();
    s.x+=s.vx; s.y+=s.vy;
  }

  // Draw particles
  pts.forEach(p=>{
    p.t+=p.speed;
    const alpha=0.4+Math.abs(Math.sin(p.t))*0.6;
    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.fillStyle=p.c;
    ctx.shadowBlur=p.s*3;
    ctx.shadowColor=p.c;
    if(p.star) drawStar(ctx,p.x,p.y,p.s);
    else {
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.s,0,Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
    p.y-=p.vy; p.x+=p.vx;
    if(p.y<-10){p.y=canvas.height+10;p.x=Math.random()*canvas.width;}
    if(p.x<-10) p.x=canvas.width+10;
    if(p.x>canvas.width+10) p.x=-10;
  });
  requestAnimationFrame(drawGlitter);
}
drawGlitter();
</script>
</body>
</html>
