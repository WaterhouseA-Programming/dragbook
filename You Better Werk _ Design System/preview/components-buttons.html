<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0A0008; font-family:'DM Sans',sans-serif; padding:24px; }
.row { display:flex; gap:12px; align-items:center; margin-bottom:16px; flex-wrap:wrap; }
.label { font-size:0.6rem; color:#C084C8; text-transform:uppercase; letter-spacing:0.1em; min-width:80px; }
</style></head><body>

<div class="row">
  <span class="label">Primary</span>
  <button style="background:linear-gradient(135deg,#FF2D78,#9B00FF);border:none;color:white;padding:16px 40px;border-radius:100px;font-family:'DM Sans',sans-serif;font-size:1rem;font-weight:500;cursor:pointer;box-shadow:0 0 30px rgba(255,45,120,0.4);">List Your Act Free 💄</button>
  <button style="background:linear-gradient(135deg,#FF2D78,#9B00FF);border:none;color:white;padding:14px 32px;border-radius:100px;font-family:'DM Sans',sans-serif;font-size:0.9rem;font-weight:500;cursor:pointer;">Find a Queen 👑</button>
  <button style="background:linear-gradient(135deg,#FF2D78,#9B00FF);border:none;color:white;padding:10px 24px;border-radius:100px;font-family:'DM Sans',sans-serif;font-size:0.82rem;font-weight:500;cursor:pointer;">List Your Act ✨</button>
</div>

<div class="row">
  <span class="label">Secondary</span>
  <button style="background:transparent;border:1px solid rgba(255,255,255,0.2);color:#FFE8FF;padding:16px 40px;border-radius:100px;font-family:'DM Sans',sans-serif;font-size:1rem;font-weight:400;cursor:pointer;">See How It Works</button>
  <button style="background:transparent;border:1px solid rgba(255,255,255,0.2);color:#FFE8FF;padding:14px 32px;border-radius:100px;font-family:'DM Sans',sans-serif;font-size:0.9rem;font-weight:400;cursor:pointer;">Browse All Performers ✨</button>
</div>

<div class="row">
  <span class="label">Nav CTA</span>
  <button style="background:linear-gradient(135deg,#FF2D78,#9B00FF);border:none;color:white;padding:10px 24px;border-radius:100px;font-family:'DM Sans',sans-serif;font-size:0.85rem;font-weight:500;cursor:pointer;box-shadow:0 0 20px rgba(255,45,120,0.4);">List Your Act ✨</button>
</div>

<div class="row">
  <span class="label">Plan btns</span>
  <button style="background:linear-gradient(135deg,#FF2D78,#9B00FF);border:none;color:white;padding:14px 28px;border-radius:100px;font-family:'DM Sans',sans-serif;font-size:0.92rem;font-weight:500;cursor:pointer;width:220px;">Start Pro Free — 30 Days ✨</button>
  <button style="background:transparent;border:1px solid rgba(255,255,255,0.15);color:#FFE8FF;padding:14px 28px;border-radius:100px;font-family:'DM Sans',sans-serif;font-size:0.92rem;font-weight:500;cursor:pointer;width:180px;">Get Started Free</button>
</div>

<div class="row">
  <span class="label">Search</span>
  <button style="background:linear-gradient(135deg,#FF2D78,#9B00FF);border:none;color:white;padding:14px 32px;border-radius:100px;font-family:'DM Sans',sans-serif;font-size:0.9rem;font-weight:500;cursor:pointer;white-space:nowrap;">Find a Queen 👑</button>
</div>

</body></html>
