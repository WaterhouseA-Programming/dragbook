<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0A0008; font-family:'DM Sans',sans-serif; padding:24px; }
.row { display:flex; gap:16px; align-items:center; margin-bottom:16px; flex-wrap:wrap; }
.label { font-size:0.6rem; color:#C084C8; text-transform:uppercase; letter-spacing:0.1em; min-width:80px; }
.sample { width:80px; height:56px; background:#1A0020; border-radius:14px; border:1px solid rgba(255,255,255,0.06); display:flex; align-items:center; justify-content:center; font-size:0.6rem; color:#C084C8; text-align:center; line-height:1.4; }
</style></head><body>

<div class="row">
  <span class="label">card hover</span>
  <div class="sample" style="box-shadow: 0 40px 80px rgba(0,0,0,0.5), 0 0 60px rgba(255,45,120,0.15); border-color:rgba(255,45,120,0.3); transform:translateY(-6px);">hover<br>state</div>
  <div class="sample">default</div>
</div>

<div class="row">
  <span class="label">btn glows</span>
  <div style="background:linear-gradient(135deg,#FF2D78,#9B00FF);border-radius:100px;padding:11px 24px;font-size:0.82rem;color:white;font-weight:500;box-shadow:0 0 40px rgba(255,45,120,0.5);">Hover glow</div>
  <div style="background:linear-gradient(135deg,#FF2D78,#9B00FF);border-radius:100px;padding:11px 24px;font-size:0.82rem;color:white;font-weight:500;box-shadow:0 0 20px rgba(255,45,120,0.4);">Nav glow</div>
  <div style="background:linear-gradient(135deg,#FF2D78,#9B00FF);border-radius:100px;padding:11px 24px;font-size:0.82rem;color:white;font-weight:500;">No glow</div>
</div>

<div class="row">
  <span class="label">widget</span>
  <div class="sample" style="box-shadow:0 20px 60px rgba(255,45,120,0.08);border-color:rgba(255,45,120,0.3);">booking<br>widget</div>
  <div class="sample" style="box-shadow:0 20px 60px rgba(255,45,120,0.25);border-color:rgba(255,45,120,0.5);">featured</div>
</div>

<div class="row">
  <span class="label">glitter fx</span>
  <div style="width:200px;height:56px;background:#0A0008;border-radius:12px;border:1px solid rgba(255,255,255,0.06);position:relative;overflow:hidden;">
    <canvas id="c" style="position:absolute;inset:0;width:100%;height:100%;"></canvas>
  </div>
  <span style="font-size:0.65rem;color:#C084C8;max-width:200px;line-height:1.5;">Animated glitter particles — floating upward, twinkling. Fixed canvas, mix-blend-mode screen.</span>
</div>

<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
c.width = 200; c.height = 56;
const cols = ['#FF2D78','#9B00FF','#FFE600','#00F5FF'];
const pts = Array.from({length:30},()=>({x:Math.random()*200,y:Math.random()*56,s:Math.random()*2+0.5,c:cols[~~(Math.random()*4)],t:Math.random()*Math.PI*2}));
function draw(){ctx.clearRect(0,0,200,56);pts.forEach(p=>{p.t+=0.04;ctx.save();ctx.globalAlpha=0.2+Math.abs(Math.sin(p.t))*0.8;ctx.fillStyle=p.c;ctx.shadowBlur=6;ctx.shadowColor=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,Math.PI*2);ctx.fill();ctx.restore();p.y-=0.3;if(p.y<-2)p.y=58;});requestAnimationFrame(draw);}
draw();
</script>

</body></html>
