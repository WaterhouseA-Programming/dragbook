<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0A0008; font-family:'DM Sans',sans-serif; padding:24px; }
.row { display:flex; gap:12px; align-items:center; margin-bottom:14px; }
.label { font-size:0.6rem; color:#C084C8; text-transform:uppercase; letter-spacing:0.1em; min-width:70px; }
.box { background:#1A0020; border:1px solid rgba(255,255,255,0.08); display:flex; align-items:center; justify-content:center; color:rgba(255,232,255,0.4); font-size:0.6rem; letter-spacing:0.06em; text-transform:uppercase; }
.val { font-size:0.6rem; color:rgba(192,132,200,0.6); margin-left:6px; font-family:monospace; }
</style></head><body>

<div class="row">
  <span class="label">radii</span>
  <div class="box" style="width:48px;height:48px;border-radius:6px;">sm<br>6px</div>
  <div class="box" style="width:52px;height:52px;border-radius:12px;">md<br>12px</div>
  <div class="box" style="width:56px;height:56px;border-radius:16px;">lg<br>16px</div>
  <div class="box" style="width:60px;height:60px;border-radius:20px;">xl<br>20px</div>
  <div class="box" style="width:64px;height:64px;border-radius:24px;">2xl<br>24px</div>
  <div class="box" style="width:68px;height:68px;border-radius:28px;">3xl<br>28px</div>
  <div class="box" style="width:72px;height:72px;border-radius:32px;">4xl<br>32px</div>
  <div class="box" style="width:76px;height:38px;border-radius:100px;">pill</div>
  <div class="box" style="width:44px;height:44px;border-radius:50%;">⊙</div>
</div>

<div class="row">
  <span class="label">spacing</span>
  <div style="display:flex; gap:0; align-items:flex-end; height:50px;">
    <div style="width:4px; height:4px; background:#FF2D78; margin-right:3px;"></div>
    <div style="width:8px; height:8px; background:#FF2D78; margin-right:3px;"></div>
    <div style="width:12px; height:12px; background:#FF2D78; margin-right:3px;"></div>
    <div style="width:16px; height:16px; background:#FF2D78; margin-right:3px;"></div>
    <div style="width:20px; height:20px; background:#FF2D78; margin-right:3px;"></div>
    <div style="width:24px; height:24px; background:#FF2D78; margin-right:3px;"></div>
    <div style="width:32px; height:32px; background:#FF2D78; margin-right:3px;"></div>
    <div style="width:40px; height:40px; background:#FF2D78; margin-right:3px;"></div>
    <div style="width:48px; height:48px; background:#9B00FF; margin-right:3px;"></div>
    <div style="width:64px; height:64px; background:#9B00FF; margin-right:3px;"></div>
    <div style="width:80px; height:80px; background:#9B00FF;"></div>
  </div>
  <span style="font-size:0.58rem;color:#C084C8;margin-left:6px;">4 8 12 16 20 24 32 40 48 64 80px</span>
</div>

</body></html>
