<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0A0008; font-family:'DM Sans',sans-serif; padding:24px; }
.section-label { font-size:0.6rem; color:#C084C8; text-transform:uppercase; letter-spacing:0.1em; margin-bottom:10px; }

/* SEARCH BAR */
.search-bar {
  display:flex;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,45,120,0.3);
  border-radius:100px;
  padding:7px 7px 7px 22px;
  align-items:center;
  backdrop-filter:blur(20px);
  max-width:820px;
  gap:0;
  flex-wrap:nowrap;
  transition:border-color .3s, box-shadow .3s;
}
.search-bar:focus-within {
  border-color:#FF2D78;
  box-shadow:0 0 40px rgba(255,45,120,0.15);
}
.search-field {
  display:flex; align-items:center; gap:8px; flex:1; min-width:0;
}
.search-field input {
  background:none; border:none; outline:none;
  color:#FFE8FF; font-family:'DM Sans',sans-serif; font-size:0.92rem;
  min-width:0; width:100%;
}
.search-field input::placeholder { color:#C084C8; }
.search-field select {
  background:none; border:none; outline:none;
  color:#C084C8; font-family:'DM Sans',sans-serif; font-size:0.86rem;
  cursor:pointer; min-width:0; width:100%;
}
.sep { width:1px; height:26px; background:rgba(255,255,255,0.1); flex-shrink:0; margin:0 10px; }
.btn-search {
  background:linear-gradient(135deg,#FF2D78,#9B00FF);
  border:none; color:white; padding:12px 26px; border-radius:100px;
  font-family:'DM Sans',sans-serif; font-size:0.86rem; font-weight:500;
  cursor:pointer; white-space:nowrap; flex-shrink:0;
  transition:transform .2s, box-shadow .2s;
}
.btn-search:hover { transform:scale(1.03); box-shadow:0 0 24px rgba(255,45,120,0.5); }

/* On narrower viewports stack the row */
@media (max-width: 680px) {
  .search-bar {
    flex-wrap:wrap;
    border-radius:20px;
    padding:14px 16px;
    gap:12px;
  }
  .search-field { width:100%; }
  .sep { display:none; }
  .btn-search { width:100%; text-align:center; padding:13px; }
}

/* FIELDS */
.row { display:flex; gap:12px; align-items:flex-start; margin-bottom:18px; flex-wrap:wrap; }
input[type=text], input[type=date], select.field {
  background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06);
  border-radius:12px; padding:11px 14px; color:#FFE8FF;
  font-family:'DM Sans',sans-serif; font-size:0.86rem; outline:none;
  width:210px; color-scheme:dark; transition:border-color .2s;
}
input[type=text]::placeholder { color:#C084C8; }
input:focus, select.field:focus { border-color:#FF2D78; box-shadow:0 0 16px rgba(255,45,120,0.12); }

/* CHECKBOXES */
.checkbox-row { display:flex; align-items:center; gap:10px; margin-bottom:9px; cursor:pointer; }
.cb { width:18px; height:18px; border-radius:6px; border:1.5px solid rgba(255,255,255,0.2); background:transparent; flex-shrink:0; display:flex; align-items:center; justify-content:center; transition:all .2s; }
.cb.on { background:linear-gradient(135deg,#FF2D78,#9B00FF); border:none; }
.cb-label { font-size:0.85rem; color:#FFE8FF; font-weight:300; flex:1; }
.cb-count { font-size:0.68rem; color:#C084C8; background:rgba(255,255,255,0.05); padding:2px 7px; border-radius:100px; }
</style></head><body>

<div class="section-label" style="margin-bottom:12px;">Search bar</div>
<div style="margin-bottom:24px;">
  <div class="search-bar">
    <div class="search-field">
      <span style="opacity:.45;font-size:.9rem;flex-shrink:0;">🔍</span>
      <input type="text" placeholder="Drag bingo, hen do host, wedding crasher…">
    </div>
    <div class="sep"></div>
    <div class="search-field" style="max-width:160px;">
      <select>
        <option>📍 Any location</option>
        <option>London</option><option>Manchester</option>
        <option>Birmingham</option><option>Brighton</option>
      </select>
    </div>
    <div class="sep"></div>
    <div class="search-field" style="max-width:170px;">
      <select>
        <option>🎭 Any event</option>
        <option>Hen Party</option><option>Corporate</option>
        <option>Wedding</option><option>Drag Bingo</option>
      </select>
    </div>
    <button class="btn-search">Find a Queen 👑</button>
  </div>
  <p style="font-size:0.62rem;color:rgba(192,132,200,0.45);margin-top:8px;padding-left:4px;">Stacks vertically on mobile · pill on desktop</p>
</div>

<div class="section-label" style="margin-bottom:10px;">Form fields</div>
<div class="row">
  <input type="text" placeholder="City or venue name…">
  <select class="field" style="width:210px;">
    <option style="background:#1A0020;">Select event type…</option>
    <option style="background:#1A0020;">Hen Party</option>
    <option style="background:#1A0020;">Corporate Event</option>
    <option style="background:#1A0020;">Wedding</option>
  </select>
  <input type="date" style="width:180px;">
</div>

<div class="section-label" style="margin-bottom:10px;">Filter checkboxes</div>
<div>
  <div class="checkbox-row">
    <div class="cb on"><span style="color:white;font-size:.6rem;font-weight:700;">✓</span></div>
    <span class="cb-label">Hen Party</span><span class="cb-count">312</span>
  </div>
  <div class="checkbox-row">
    <div class="cb"></div>
    <span class="cb-label">Corporate</span><span class="cb-count">198</span>
  </div>
  <div class="checkbox-row">
    <div class="cb on"><span style="color:white;font-size:.6rem;font-weight:700;">✓</span></div>
    <span class="cb-label">Travels UK-wide</span>
  </div>
</div>

</body></html>
